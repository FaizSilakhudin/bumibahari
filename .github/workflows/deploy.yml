name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (fast-forward git pull only)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WBB_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "103.67.244.132 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOU2PtU9qCflUZNuLX8N6gwv0GGzhyDC4Us/qd7RY0Sq" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts root@103.67.244.132 "deploy"
